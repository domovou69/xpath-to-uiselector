<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 500" width="940" height="500" role="img" aria-label="Wrong UiSelectors of three Claude 5.5 runs without rules, by kind of mistake" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
<title>Wrong UiSelectors of three Claude 5.5 runs without rules, by kind of mistake</title>
<rect width="940" height="500" fill="#fcfcfb"/>
<text x="40" y="46" font-size="22" fill="#0b0b0b" font-weight="600">Why Claude’s UiSelectors were wrong</text><text x="40" y="74" font-size="15" fill="#52514e">170 wrong answers of Opus, Sonnet and Haiku 5.5 without rules (680 locators each)</text><path d="M220.0,120.0 A150,150 0 0 1 321.1,380.9 L279.3,335.0 A88,88 0 0 0 220.0,182.0 Z" fill="#6250d6" stroke="#fcfcfb" stroke-width="3"/><text x="331.0" y="232.0" font-size="14" fill="#fcfcfb" text-anchor="middle" font-weight="600">38 %</text><path d="M321.1,380.9 A150,150 0 0 1 127.4,388.0 L165.7,339.2 A88,88 0 0 0 279.3,335.0 Z" fill="#8f85e3" stroke="#fcfcfb" stroke-width="3"/><text x="224.4" y="393.9" font-size="14" fill="#0b0b0b" text-anchor="middle" font-weight="600">22 %</text><path d="M127.4,388.0 A150,150 0 0 1 74.3,305.7 L134.5,290.9 A88,88 0 0 0 165.7,339.2 Z" fill="#a8a69e" stroke="#fcfcfb" stroke-width="3"/><text x="120.0" y="339.5" font-size="14" fill="#0b0b0b" text-anchor="middle" font-weight="600">11 %</text><path d="M74.3,305.7 A150,150 0 0 1 83.3,208.1 L139.8,233.7 A88,88 0 0 0 134.5,290.9 Z" fill="#c3c2b7" stroke="#fcfcfb" stroke-width="3"/><text x="101.5" y="264.0" font-size="14" fill="#0b0b0b" text-anchor="middle" font-weight="600">11 %</text><path d="M83.3,208.1 A150,150 0 0 1 118.9,159.1 L160.7,205.0 A88,88 0 0 0 139.8,233.7 Z" fill="#d6d5cc" stroke="#fcfcfb" stroke-width="3"/><text x="123.7" y="205.1" font-size="14" fill="#0b0b0b" text-anchor="middle" font-weight="600">6 %</text><path d="M118.9,159.1 A150,150 0 0 1 220.0,120.0 L220.0,182.0 A88,88 0 0 0 160.7,205.0 Z" fill="#e4e3dc" stroke="#fcfcfb" stroke-width="3"/><text x="177.0" y="164.0" font-size="14" fill="#0b0b0b" text-anchor="middle" font-weight="600">12 %</text><text x="220" y="268" font-size="34" fill="#0b0b0b" text-anchor="middle" font-weight="600">170</text><text x="220" y="292" font-size="14" fill="#52514e" text-anchor="middle">wrong</text><rect x="440" y="138" width="14" height="14" rx="3" fill="#6250d6"/><text x="464" y="150" font-size="15" fill="#0b0b0b">Case-insensitive textContains / textStartsWith</text><text x="905" y="150" font-size="15" fill="#0b0b0b" text-anchor="end" font-weight="600">65</text><rect x="440" y="184" width="14" height="14" rx="3" fill="#8f85e3"/><text x="464" y="196" font-size="15" fill="#0b0b0b">Missing (?s): . stops at a line break</text><text x="905" y="196" font-size="15" fill="#0b0b0b" text-anchor="end" font-weight="600">38</text><rect x="440" y="230" width="14" height="14" rx="3" fill="#a8a69e"/><text x="464" y="242" font-size="15" fill="#0b0b0b">Values only the page source has</text><text x="905" y="242" font-size="15" fill="#0b0b0b" text-anchor="end" font-weight="600">18</text><rect x="440" y="276" width="14" height="14" rx="3" fill="#c3c2b7"/><text x="464" y="288" font-size="15" fill="#0b0b0b">Java-style \\ escaping</text><text x="905" y="288" font-size="15" fill="#0b0b0b" text-anchor="end" font-weight="600">18</text><rect x="440" y="322" width="14" height="14" rx="3" fill="#d6d5cc"/><text x="464" y="334" font-size="15" fill="#0b0b0b">Positions: instance() in childSelector, //X[1]</text><text x="905" y="334" font-size="15" fill="#0b0b0b" text-anchor="end" font-weight="600">11</text><rect x="440" y="368" width="14" height="14" rx="3" fill="#e4e3dc"/><text x="464" y="380" font-size="15" fill="#0b0b0b">Other: classNameMatches, (?i), dropped tests</text><text x="905" y="380" font-size="15" fill="#0b0b0b" text-anchor="end" font-weight="600">20</text><text x="440" y="430" font-size="13" fill="#7a7872">Line-break failures need a line break in a value;</text><text x="440" y="448" font-size="13" fill="#7a7872">real resource ids have none, so most of those are harmless.</text>
</svg>
