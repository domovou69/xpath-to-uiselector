<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420" role="img" aria-label="XPath to Android UiSelector: can Claude 5.5 replace a converter?" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
<title>XPath to Android UiSelector: can Claude 5.5 replace a converter?</title>
<rect width="1000" height="420" fill="#14141a"/><text x="56" y="92" font-size="44" fill="#f4f3ef" font-weight="700">XPath → Android UiSelector</text><text x="56" y="140" font-size="30" fill="#c9c6ff">Can Claude 5.5 replace a converter?</text><text x="80" y="196" font-size="20" fill="#d8d6cf" font-family="'SF Mono', Menlo, Consolas, monospace">//*[contains(@text,"Total")]</text><text x="470" y="196" font-size="17" fill="#a7a59d">also matches “TOTAL”?</text><rect x="56" y="214" width="888" height="62" rx="10" fill="#1f1f28" stroke="#8a2d2b" stroke-width="1.5"/><text x="80" y="252" font-size="17" fill="#a7a59d" font-weight="600">Claude</text><text x="230" y="253" font-size="20" fill="#f4f3ef" font-family="'SF Mono', Menlo, Consolas, monospace">textContains("Total")</text><text x="920" y="252" font-size="17" fill="#ff7a72" text-anchor="end" font-weight="600">✗ yes, wrong</text><rect x="56" y="290" width="888" height="62" rx="10" fill="#1f1f28" stroke="#2e7d4f" stroke-width="1.5"/><text x="80" y="328" font-size="17" fill="#a7a59d" font-weight="600">Converter</text><text x="230" y="329" font-size="20" fill="#f4f3ef" font-family="'SF Mono', Menlo, Consolas, monospace">textMatches("(?s).*Total.*")</text><text x="920" y="328" font-size="17" fill="#5fd38d" text-anchor="end" font-weight="600">✓ no, exact</text><text x="56" y="398" font-size="16" fill="#a7a59d">680 locators · emulator-checked · converter: 0 wrong · Claude without rules: 47–63 wrong</text>
