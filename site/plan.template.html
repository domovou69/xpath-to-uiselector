<style>
:root {
  --bg: #f7f8fa; --panel: #fff; --text: #1b1f24; --muted: #5a6572; --line: #d8dde4;
  --accent: #0b5fd6; --code-bg: #eef1f5;
  --exact: #17692f; --exact-bg: #e1f4e6; --close: #8a5300; --close-bg: #fdf0d5; --skip: #a3262e; --skip-bg: #fbe4e5;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12151a; --panel: #1b2027; --text: #e6e9ee; --muted: #9aa5b3; --line: #2f3742;
    --accent: #6aa5ff; --code-bg: #262d36;
    --exact: #7fd99a; --exact-bg: #1c3a27; --close: #f0c168; --close-bg: #3d2f12; --skip: #ff9aa0; --skip-bg: #432024;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
main { min-width: 0; max-width: 860px; margin: 0 auto; padding: 24px 16px 48px; }
h1 { font-size: 1.6rem; margin: 0 0 4px; }
.lead { color: var(--muted); margin: 0 0 16px; }
a { color: var(--accent); }
nav { display: flex; flex-wrap: wrap; gap: 4px 16px; margin-bottom: 20px; }
label { font-weight: 600; display: block; margin-bottom: 6px; }
textarea { width: 100%; min-height: 120px; padding: 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--text); font: 14px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; resize: vertical; }
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 10px 0 16px; }
.bar .sum { color: var(--muted); margin-left: auto; }
button { font: inherit; cursor: pointer; }
.chip, .copy { border: 1px solid var(--line); background: var(--panel); color: var(--text); border-radius: 999px; padding: 4px 12px; }
.copy { border-radius: 6px; padding: 2px 10px; flex: none; }
.chip:hover, .copy:hover { border-color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.card { background: var(--panel); border: 1px solid var(--line); border-left-width: 4px; border-radius: 8px; padding: 10px 12px; margin-bottom: 10px; }
.card.exact { border-left-color: var(--exact); } .card.close { border-left-color: var(--close); } .card.skip { border-left-color: var(--skip); }
.head > *, .out > * { min-width: 0; }
.head, .out { display: flex; gap: 10px; align-items: flex-start; }
.out { margin-top: 8px; justify-content: space-between; }
code { font: 13px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; overflow-wrap: anywhere; }
.ui { background: var(--code-bg); padding: 6px 8px; border-radius: 6px; flex: 1; }
.badge { flex: none; font-size: 12px; font-weight: 700; text-transform: uppercase; padding: 1px 8px; border-radius: 999px; }
.badge.exact { color: var(--exact); background: var(--exact-bg); } .badge.close { color: var(--close); background: var(--close-bg); } .badge.skip { color: var(--skip); background: var(--skip-bg); }
.note { margin: 8px 0 0; font-size: 14px; color: var(--muted); }
footer { margin-top: 28px; color: var(--muted); font-size: 14px; }
.sub { color: var(--muted); margin: 0 0 12px; }
.bar { height: 8px; border-radius: 999px; background: var(--code-bg); overflow: hidden; margin: 6px 0 24px; }
.bar > i { display: block; height: 100%; background: var(--exact); }
h2 { font-size: 1.1rem; margin: 24px 0 10px; }
.item { background: var(--panel); border: 1px solid var(--line); border-left-width: 4px; border-radius: 8px; margin-bottom: 8px; }
.item.done { border-left-color: var(--exact); } .item.doing { border-left-color: var(--accent); } .item.todo { border-left-color: var(--close); } .item.optional { border-left-color: var(--muted); }
summary { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; padding: 10px 12px; cursor: pointer; }
.num { color: var(--muted); font-variant-numeric: tabular-nums; }
.title { font-weight: 600; flex: 1 1 12rem; min-width: 0; }
.meta { color: var(--muted); font-size: 14px; }
.body { padding: 0 12px 12px; font-size: 15px; overflow-wrap: anywhere; }
.badge.doing { color: var(--accent); background: var(--code-bg); } .badge.todo { color: var(--close); background: var(--close-bg); } .badge.optional { color: var(--muted); background: var(--code-bg); }
</style>
